# ─────────────────────────────────────────────────────────────────────────────
# SOC Agent — Infrastructure Services (Phase 1 & 2)
# ─────────────────────────────────────────────────────────────────────────────
# Runs PostgreSQL and Redis only.  The FastAPI app is run locally via uvicorn
# (with hot-reload) during development.  Member 3 will add the full app service
# in docker-compose.yml during Phase 3.
#
# USAGE
#   Start:   docker compose -f docker-compose.infra.yml up -d
#   Stop:    docker compose -f docker-compose.infra.yml down
#   Destroy: docker compose -f docker-compose.infra.yml down -v   ← wipes data
#   Logs:    docker compose -f docker-compose.infra.yml logs -f
#
# FIRST-TIME SETUP (each team member, once)
#   1. Install Docker Desktop: https://www.docker.com/products/docker-desktop/
#   2. cp .env.example .env   — then fill in your values
#   3. docker compose -f docker-compose.infra.yml up -d
#   4. python -m venv .venv && source .venv/bin/activate
#   5. pip install -r backend/requirements.txt
#   6. alembic upgrade head   — runs migrations against the containerised DB
#   7. uvicorn backend.main:app --reload
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine          # alpine = smaller image, same functionality
    container_name: soc_postgres
    restart: unless-stopped            # auto-restart on Docker daemon reboot
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_password}
      POSTGRES_DB: ${POSTGRES_DB:-soc_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"  # expose to host so uvicorn can reach it
    volumes:
      - postgres_data:/var/lib/postgresql/data   # persist DB across restarts
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
        # ^ runs once on first container creation (creates extensions etc.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc_user} -d ${POSTGRES_DB:-soc_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - soc_network

  # ── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: soc_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-soc_redis_password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"     # expose to host so uvicorn can reach it
    volumes:
      - redis_data:/data               # persist queue across restarts
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-soc_redis_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - soc_network

  # ── pgAdmin 4  (optional — comment out if you prefer psql or TablePlus) ───
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: soc_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@soc.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_EMAIL:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"   # single-user desktop mode
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - soc_network
    profiles:
      - tools                          # only starts with: docker compose --profile tools up -d

  # ── Redis Commander  (optional — browser UI for Redis) ────────────────────
  redis_commander:
    image: rediscommander/redis-commander:latest
    container_name: soc_redis_ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:redis:6379:0:${REDIS_PASSWORD:-soc_redis_password}"
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - soc_network
    profiles:
      - tools                          # only starts with: docker compose --profile tools up -d

# ─────────────────────────────────────────────────────────────────────────────
# Volumes — named volumes survive `docker compose down` but not `down -v`
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  soc_network:
    driver: bridge
    name: soc_network
