# alembic.ini
# ─────────────────────────────────────────────────────────────────────────────
# Alembic configuration for the SOC Agent database migrations.
#
# Usage:
#   alembic upgrade head      — apply all pending migrations
#   alembic downgrade -1      — roll back the last migration
#   alembic revision --autogenerate -m "description"  — generate new migration
#
# The `sqlalchemy.url` below is overridden at runtime by migrations/env.py
# which reads DATABASE_URL from the .env file.  This placeholder prevents
# Alembic from erroring when run without the env var set.
# ─────────────────────────────────────────────────────────────────────────────

[alembic]
script_location = migrations
prepend_sys_path = .

# Overridden in env.py — do not set a real URL here (would expose secrets)
sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging — pipe Alembic logs through Python's standard logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
